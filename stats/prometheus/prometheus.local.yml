# compose: the service name resolves to every replica
global:
  scrape_interval: 15s
rule_files: [ /etc/prometheus/rules.yml ]
scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: [localhost:9090] }]
  - job_name: core
    dns_sd_configs: [{ names: [core], type: A, port: 8000 }]
  - job_name: frontend
    dns_sd_configs: [{ names: [frontend], type: A, port: 9113 }]
  - job_name: cadvisor
    dns_sd_configs: [{ names: [cadvisor], type: A, port: 8080 }]
  - job_name: node
    dns_sd_configs: [{ names: [node-exporter], type: A, port: 9100 }]
  - job_name: grafana
    dns_sd_configs: [{ names: [grafana], type: A, port: 3000 }]
  - job_name: postgres
    static_configs:
      - targets: [pg-exporter-1:9187, pg-exporter-2:9187, pg-exporter-3:9187]
  # patroni: which node is the leader (patroni_primary) and how healthy the cluster is
  - job_name: patroni
    static_configs:
      - targets: [pg-1:8008, pg-2:8008, pg-3:8008]
  - job_name: redis
    metrics_path: /scrape
    static_configs:
      - targets: [redis://redis-1:6379, redis://redis-2:6379]
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: instance }
      - { target_label: __address__, replacement: "redis-exporter:9121" }
  - job_name: mariadb
    static_configs: [{ targets: ["mysqld-exporter:9104"] }]
  - job_name: backup
    static_configs: [{ targets: ["backup:9199"] }]
  # the sites as a user sees them: also covers moodle, which has no metrics of its own
  - job_name: probes
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs:
      - targets:
          - http://frontend/__node
          - http://core:8000/readyz
          - http://static/static/style.css
          - http://moodle/login/index.php
          - http://grafana:3000/api/health
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: instance }
      - { target_label: __address__, replacement: "blackbox:9115" }
