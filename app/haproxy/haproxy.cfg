# One stable name for the database: "db". Patroni answers on :8008 which node is the
# leader (/primary) and which ones are healthy replicas (/replica); haproxy follows it.
#   db:5432 -> the leader (reads and writes)      db:5433 -> the replicas (reads)
global
    maxconn 500

defaults
    mode tcp
    timeout connect 3s
    timeout client  30m
    timeout server  30m

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid 5s

listen primary
    bind :5432
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none
    server pg-1 pg-1:5432 check port 8008
    server pg-2 pg-2:5432 check port 8008
    server pg-3 pg-3:5432 check port 8008

listen replicas
    bind :5433
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none
    server pg-1 pg-1:5432 check port 8008
    server pg-2 pg-2:5432 check port 8008
    server pg-3 pg-3:5432 check port 8008

listen stats
    bind 127.0.0.1:8404
    mode http
    stats enable
    stats uri /
